<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eya Luxury Boutique</title>
<meta name="description" content="Eya Luxury Boutique. Time is your signature.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#06150F; --panel:#0C241B; --line:rgba(235,203,154,.22);
  --ivory:#F4ECDD; --muted:rgba(244,236,221,.78); --champ:#EBCB9A;
  --body:"Inter","Cairo",system-ui,sans-serif; --disp:"Cormorant Garamond","Cairo",serif;
  --cf:url("images/cover.jpg");
  --i1:url("images/watch-01.jpg");
  --i2:url("images/watch-02.jpg");
  --i3:url("images/watch-03.jpg");
  --i4:url("images/watch-04.jpg");
  --i5:url("images/watch-05.jpg");
  --i6:url("images/watch-06.jpg");
  --i7:url("images/watch-07.jpg");
  --i8:url("images/watch-08.jpg");
  --i9:url("images/watch-09.jpg");
  --i10:url("images/watch-10.jpg");
  --i11:url("images/watch-11.jpg");
  --i12:url("images/watch-12.jpg");
  --i13:url("images/watch-13.jpg");
  --i14:url("images/watch-14.jpg");
  --i15:url("images/watch-15.jpg");
  --i16:url("images/watch-16.jpg");
  --i17:url("images/watch-17.jpg");
  --i18:url("images/watch-18.jpg");
  --i19:url("images/watch-19.jpg");
  --i20:url("images/watch-20.jpg");
  --i21:url("images/watch-21.jpg");
  --i22:url("images/watch-22.jpg");
  --i23:url("images/watch-23.jpg");
  --i24:url("images/watch-24.jpg");
  --i25:url("images/watch-25.jpg");
  --i26:url("images/watch-26.jpg");
  --i27:url("images/watch-27.jpg");
  --i28:url("images/watch-28.jpg");
  --i29:url("images/watch-29.jpg");
  --i30:url("images/watch-30.jpg");
  --i31:url("images/watch-31.jpg");
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html.lenis,html.lenis body{height:auto}.lenis.lenis-smooth{scroll-behavior:auto!important}.lenis.lenis-stopped{overflow:hidden}
body{font-family:var(--body);line-height:1.65;color:var(--ivory);background:var(--ink);-webkit-font-smoothing:antialiased}
html[lang=ar] body{font-family:"Cairo",system-ui,sans-serif}
html[lang=ar] *{letter-spacing:0!important}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
ul{list-style:none}
:focus-visible{outline:2px solid var(--champ);outline-offset:3px}
.pad{padding-inline:clamp(1.25rem,6vw,6rem)}
h1,h2,h3,.mark{font-family:var(--disp)}
html[lang=ar] h1,html[lang=ar] h2,html[lang=ar] h3{font-family:"Cairo",sans-serif;font-weight:600}

/* Nav */
.nav{position:absolute;z-index:2;top:calc(1.5rem + env(safe-area-inset-top,0px));inset-inline:clamp(1.25rem,6vw,6rem);
  display:flex;justify-content:space-between;align-items:center;gap:1rem;padding-bottom:1.1rem;border-bottom:1px solid var(--line)}
.mark{font-weight:600;font-size:1.3rem;letter-spacing:.2em;text-decoration:none;white-space:nowrap}
.nav .r{display:flex;align-items:center;gap:1.6rem}
.nav a.wa{font-weight:500;color:var(--champ);text-decoration:none;border-bottom:1px solid transparent}
.nav a.wa:hover{border-color:var(--champ)}
.lang{display:flex;gap:.3rem}
.lang button{background:transparent;border:1px solid transparent;border-radius:2px;padding:.3rem .65rem;font-size:.88rem;color:var(--muted)}
.lang button[aria-pressed=true]{border-color:var(--champ);color:var(--champ)}

/* Hero */
.hero{position:relative;min-height:100vh;min-height:100svh;display:grid;grid-template-columns:repeat(12,1fr);column-gap:2rem;align-items:center;
  padding-top:calc(7rem + env(safe-area-inset-top,0px));padding-bottom:3rem;
  background:radial-gradient(70% 80% at 80% 45%,#123F31 0%,transparent 70%),var(--ink)}
html[dir=rtl] .hero{background:radial-gradient(70% 80% at 20% 45%,#123F31 0%,transparent 70%),var(--ink)}
.copy{grid-column:1/span 6}
h1{font-weight:500;font-size:clamp(3rem,5.6vw,5.8rem);line-height:1.02;letter-spacing:-.01em;margin-bottom:1rem}
.sub{font:500 clamp(1.2rem,1.7vw,1.6rem)/1.35 var(--disp);color:var(--champ);margin-bottom:1.4rem;max-width:30rem}
html[lang=ar] .sub{font-family:"Cairo",sans-serif}
.lead{max-width:30rem;color:var(--muted);margin-bottom:2.2rem}
.cta{display:inline-block;padding:1rem 1.8rem;background:var(--champ);color:#1b1209;font-weight:500;text-decoration:none;border-radius:2px;border:0;transition:background .2s}
.cta:hover{background:#F6DCB4}
.feat{grid-column:8/span 5;justify-self:end;width:100%;max-width:32rem;display:flex;flex-direction:column;gap:.8rem}
.pic{aspect-ratio:4/5;background:var(--panel) center/cover no-repeat;border:1px solid var(--line)}
.feat .pic{width:min(100%,calc((100svh - 13rem)*.8))}
.feat p{font-size:.95rem;color:var(--muted)}

/* Sections */
section{padding-block:5rem;border-top:1px solid var(--line)}
h2{font-weight:500;font-size:clamp(2rem,3.4vw,3rem);line-height:1.12}
.kick{color:var(--champ);margin-top:.6rem;font-weight:500}
.why ul{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:2rem 2.4rem;margin-top:2.6rem}
.why li{border-top:1px solid var(--champ);padding-top:1rem}
.why h3{font-weight:600;font-size:1.3rem;line-height:1.25;margin-bottom:.5rem}
.why li p{color:var(--muted);font-size:.95rem}
.story{display:grid;grid-template-columns:repeat(12,1fr);column-gap:2rem;row-gap:1.4rem}
.story h2{grid-column:1/span 5}
.story div{grid-column:7/span 6;display:grid;gap:1.2rem;color:var(--muted);max-width:38rem}

.top{display:flex;justify-content:space-between;align-items:end;gap:1.5rem;flex-wrap:wrap;margin-bottom:2rem}
.top p.s{color:var(--muted);max-width:34rem;margin-top:.6rem}
.chips{display:flex;gap:.6rem;flex-wrap:wrap}
.chip{padding:.55rem 1.1rem;background:transparent;border:1px solid var(--line);border-radius:99px;font-size:.92rem;transition:background .2s,border-color .2s}
.chip:hover{background:rgba(244,236,221,.07)}
.chip[aria-pressed=true]{background:var(--champ);border-color:var(--champ);color:#1b1209;font-weight:500}
.count{color:var(--muted);font-size:.92rem;margin-bottom:1.2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15.5rem,1fr));gap:1.6rem}
.card{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line)}
.card[hidden]{display:none}
.card .pic{border:0;border-bottom:1px solid var(--line)}
.card .b{padding:1rem 1.1rem 1.2rem;display:flex;flex-direction:column;gap:.5rem;flex:1}
.card h3{font-weight:500;font-size:1.35rem;line-height:1.25}
.card p{font-size:.92rem;color:var(--muted);flex:1}
.card .pr{flex:none;font-size:1.1rem;font-weight:500;color:var(--champ)}
.card a{align-self:flex-start;font-weight:500;color:var(--champ);text-decoration:none;border-bottom:1px solid transparent;padding:.2rem 0}
.card a:hover{border-color:var(--champ)}
.end{font:500 clamp(1.5rem,2.4vw,2.2rem)/1.3 var(--disp);text-align:center;padding-block:4rem;border-top:1px solid var(--line)}
html[lang=ar] .end{font-family:"Cairo",sans-serif}
footer{padding-block:2.5rem 3rem;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;color:var(--muted);font-size:.92rem}

@media (max-width:900px){
  .hero{align-content:start;row-gap:2rem;padding-top:6rem}
  .feat{grid-column:1/-1;grid-row:1;max-width:none}
  .feat .pic{width:100%}
  .copy,.story h2,.story div{grid-column:1/-1}
  h1{font-size:clamp(2.8rem,12vw,4.2rem)}
  .cta{display:block;text-align:center}
  .nav .wa{display:none}
  .mark{font-size:1rem}
  .grid{grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:1rem}
  .card h3{font-size:1.1rem}
  section{padding-block:3.5rem}
}

#sp{position:fixed;top:0;left:0;right:0;height:3px;background:var(--champ);transform-origin:0 50%;transform:scaleX(0);z-index:50;pointer-events:none}
/* 3D gallery: real photographs on a curved ring, turned by scroll */
.gal{height:600vh;position:relative;padding:0!important;border-top:1px solid var(--line);background:#050f0b}
.gs{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:radial-gradient(70% 60% at 50% 50%,#0f3a2d,#050f0b)}
.gs canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.gv{position:absolute;inset:0;pointer-events:none;background:radial-gradient(95% 85% at 50% 50%,transparent 50%,rgba(5,15,11,.8) 100%)}
.gtop{position:absolute;top:calc(1.8rem + env(safe-area-inset-top,0px));inset-inline:0;text-align:center;padding-inline:1.5rem;pointer-events:none;text-shadow:0 2px 14px rgba(0,0,0,.7)}
.gtop h2{font-size:clamp(1.5rem,3vw,2.4rem)}
.gtop p{color:var(--muted);font-size:.92rem;margin-top:.3rem}
.gcount{position:absolute;inset-inline-end:clamp(1.25rem,6vw,6rem);top:50%;transform:translateY(-50%);font-size:.85rem;color:var(--champ);text-shadow:0 1px 8px #000}
.ginfo{position:absolute;bottom:calc(1.8rem + env(safe-area-inset-bottom,0px));inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:.35rem;text-align:center;padding-inline:1.5rem;text-shadow:0 2px 14px rgba(0,0,0,.8)}
.ginfo h3{font-weight:500;font-size:clamp(1.2rem,2.2vw,1.7rem);line-height:1.2}
.ginfo p{color:var(--champ);font-weight:500}
.ginfo a{margin-top:.4rem;padding:.8rem 1.5rem;background:var(--champ);color:#1b1209;font-weight:500;text-decoration:none;border-radius:2px;text-shadow:none}
.ginfo a:hover{background:#F6DCB4}
.gal.nogl .gs::after{content:"3D needs WebGL";position:absolute;inset:0;display:grid;place-items:center}

/* Cinematic scroll film: first photo zooms into bracelet and crystal, turns through other angles, then reveals the brand */
.cine{height:700vh;position:relative;padding:0!important;border-top:1px solid var(--line);background:#07110d}
.cpin{position:sticky;top:0;height:100vh;height:100svh;display:grid;place-items:center}
.cstage{position:relative;height:100%;width:min(100vw,calc(100svh*9/16));overflow:hidden;background:#1b1410;box-shadow:0 0 90px rgba(0,0,0,.6);perspective:1000px}
.cl{position:absolute;inset:0;overflow:hidden}
.cbg{position:absolute;inset:-12%;background-size:cover;background-position:center;filter:blur(30px) brightness(.85) saturate(1.1)}
.cp{position:absolute;inset:0;background-repeat:no-repeat;background-position:center;will-change:transform}
#cn-lb .cp{background-size:cover}
#cn-la .cp{background-size:contain;background-position:50% 45%}
#cn-lc .cp{background-size:contain;background-position:50% 62%}
#cn-la,#cn-lc{opacity:0}
.cdof{position:absolute;inset:0;pointer-events:none;opacity:0;-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
  -webkit-mask-image:radial-gradient(ellipse 55% 42% at 50% 48%,transparent 55%,#000 100%);mask-image:radial-gradient(ellipse 55% 42% at 50% 48%,transparent 55%,#000 100%)}
.cvig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(20,14,10,.4) 100%)}
.chud{position:absolute;inset:0;pointer-events:none;padding:calc(1.4rem + env(safe-area-inset-top,0px)) 1.4rem calc(1.4rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;justify-content:space-between;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.chud .r{display:flex;justify-content:space-between;font-size:.8rem}
.cmini{font:600 .95rem var(--disp);letter-spacing:.2em}
.cbar{position:absolute;inset-inline-end:0;top:50%;width:2px;height:28%;transform:translateY(-50%);background:rgba(244,236,221,.25)}
.cbar i{display:block;width:100%;height:0;background:var(--champ)}
.ccap{font-size:.85rem;text-align:center}
.cfin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(3.2rem + env(safe-area-inset-top,0px)) 1.6rem 0;text-align:center;opacity:0;pointer-events:none;text-shadow:0 1px 10px rgba(0,0,0,.5);background:linear-gradient(rgba(20,14,10,.7),rgba(20,14,10,0) 45%)}
.cfin .lg{font:600 1.7rem/1.1 var(--disp);letter-spacing:.24em;margin-bottom:1.1rem;min-height:4.4rem;display:flex;flex-direction:column;justify-content:center}
.cfin .lg small{font:500 .62rem var(--body);letter-spacing:.42em;margin-top:.5rem;color:var(--champ)}
.cfin h2{font-size:clamp(1.7rem,6.4vw,2.4rem);line-height:1.12}
.cbtn{position:absolute;left:50%;bottom:calc(2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);white-space:nowrap;padding:1rem 1.8rem;background:var(--ivory);color:#3A332C;text-decoration:none;font-weight:500;font-size:.92rem;border-radius:2px;opacity:0}
.cbtn:hover{background:#fff}
</style>
</head>
<body>
<div id="sp" aria-hidden="true"></div>
<header class="hero pad">
  <nav class="nav" aria-label="Primary">
    <a class="mark" href="#">EYA LUXURY BOUTIQUE</a>
    <div class="r">
      <a class="wa" href="#" data-wa="g">WhatsApp</a>
      <div class="lang" role="group" aria-label="Language">
        <button data-l="en">EN</button><button data-l="fr">FR</button><button data-l="ar">عربي</button>
      </div>
    </div>
  </nav>
  <div class="copy">
    <h1 data-t="tag"></h1>
    <p class="sub" data-t="sub"></p>
    <p class="lead" data-t="welcome"></p>
    <a class="cta" href="#collection" data-t="cta"></a>
  </div>
  <figure class="feat">
    <div class="pic" id="hpic" role="img" style="background-image:var(--i20)"></div>
    <p id="hcap"></p>
  </figure>
</header>

<main>
  <section class="cine" id="cine" aria-label="Cinematic film">
    <div class="cpin"><div class="cstage" id="cn-st">
      <div class="cl" id="cn-lb"><div class="cbg" style="background-image:var(--cf)"></div><div class="cp" id="cn-pb" role="img" aria-label="Rose gold watch with a diamond-paved dial" style="background-image:var(--cf)"></div></div>
      <div class="cl" id="cn-la"><div class="cbg" style="background-image:var(--i20)"></div><div class="cp" id="cn-pa" role="img" aria-label="Rainbow bezel watch" style="background-image:var(--i20)"></div></div>
      <div class="cl" id="cn-lc"><div class="cbg" style="background-image:var(--i15)"></div><div class="cp" id="cn-pc" role="img" aria-label="Rainbow bezel chronograph" style="background-image:var(--i15)"></div></div>
      <div class="cdof" id="cn-dof"></div><div class="cvig"></div>
      <div class="chud"><div class="r"><span class="cmini">EYA</span><span id="cn-count">01 / 05</span></div>
        <div class="cbar" aria-hidden="true"><i id="cn-prog"></i></div><div class="ccap" id="cn-cap"></div></div>
      <div class="cfin" id="cn-final"><div class="lg">EYA<small>LUXURY BOUTIQUE</small></div><h2 id="cn-h"></h2></div>
      <a class="cbtn" id="cn-btn" href="#" target="_blank" rel="noopener"></a>
    </div></div>
  </section>

  <section class="gal" id="gal" aria-label="3D gallery">
    <div class="gs">
      <canvas id="glc" aria-hidden="true"></canvas><div class="gv"></div>
      <div class="gtop"><h2 data-t="gal_h"></h2><p data-t="gal_p"></p></div>
      <div class="gcount" id="gcount"></div>
      <div class="ginfo"><h3 id="gname"></h3><p id="gprice"></p><a id="genq" href="#" target="_blank" rel="noopener"></a></div>
    </div>
  </section>
  <section class="why pad" aria-labelledby="wh">
    <h2 id="wh" data-t="why_h"></h2>
    <p class="kick" data-t="why_k"></p>
    <ul id="whys"></ul>
  </section>

  <section class="story pad" aria-labelledby="sh">
    <h2 id="sh" data-t="story_h"></h2>
    <div><p data-t="p1"></p><p data-t="p2"></p><p data-t="p3"></p></div>
  </section>

  <section class="pad" id="collection" aria-labelledby="ct">
    <div class="top">
      <div><h2 id="ct" data-t="coll_h"></h2><p class="s" data-t="coll_p"></p></div>
      <div class="chips" role="group" id="chips"></div>
    </div>
    <p class="count" id="count" aria-live="polite"></p>
    <ul class="grid" id="grid"></ul>
  </section>

  <p class="end pad" data-t="end"></p>
</main>

<footer class="pad">
  <span>EYA LUXURY BOUTIQUE</span>
  <a href="#" data-wa="g">WhatsApp +216 52 616 996</a>
</footer>
